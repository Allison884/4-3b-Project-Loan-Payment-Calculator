<!DOCTYPE html> 
<html>
 <head> 
<title> Loan Payment Calculator </title>

 <script> function P() { 
let PV = Number(document.getElementById("PV").value); 
let years = Number (document.getElementById("years").value); 
let percent = Number (document.getElementById("percent").value);

let r = percent / 100 / 12;
let n = years * 12;

 let d = (r * PV) / (1 - (1 + r) ** (-n));
document.getElementById("ans").innerHTML = "$" + d.toFixed(2);

 } </script> 

</head> 
<body> 
<h3> Fill in the blanks to find your monthly payment</h3> 

<p> "Present Value - Amount you wish to borrow" <input id="PV"> 

<br> Years <input id="years"> 

<br> "Annual Interest Rate %" <input id="percent"> 

<br> <button onclick="P()"> Calculate the Monthly Payment 

</button> 
</p>
 <p> Your Answer is: <span id="ans">____________</span> </p> </body> </html>
